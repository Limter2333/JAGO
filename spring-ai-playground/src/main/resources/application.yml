server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: spring-ai-playground
  jackson:
    default-property-inclusion: non_null
  # 确保 MVC 使用 UTF-8
  web:
    encoding:
      charset: UTF-8
      enabled: true

  ai:
    dashscope:
      # 从环境变量读取 API Key，或在这里硬编码(不推荐)
      api-key: ${QWEN_API_KEY:}
      chat:
        options:
          model: kimi-k2-thinking         # 模型: qwen-max, qwen-plus, qwen-turbo 等
          temperature: 0.7             # 温度: 0.0-1.0，越高越创造性
          max-tokens: 2000             # 最大输出token数
          top-p: 0.9                   # 核采样
          enable-search: false         # 是否启用联网搜索

money-tree:
  memory:
    max-history: 20